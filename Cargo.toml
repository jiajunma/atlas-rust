[workspace]
members = ["crates/atlas-core", "crates/atlas-cli", "crates/atlas-real-group"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"
version = "0.1.0"

[workspace.dependencies]
atlas-core = { path = "crates/atlas-core" }

# Benchmarks and corpus comparisons use the release profile; link-time
# optimization plus a single codegen unit give the interpreter loop a
# free 5-15% (panic=abort is NOT allowed: domain_builtins.rs and
# rep_table.rs rely on catch_unwind).
[profile.release]
lto = "fat"
codegen-units = 1
