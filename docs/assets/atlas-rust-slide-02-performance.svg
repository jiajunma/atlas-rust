<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Atlas-Rust 运行速度改善轨迹</title>
  <desc id="desc">同一批238个真实任务中，Rust版本相对原版Atlas的耗时倍数从29.5下降到3.29；复杂任务从77.2秒下降到8.4秒，当前主要短板是内存。</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .ink { fill: #0F172A; }
      .muted { fill: #64748B; }
      .axis { fill: #475569; font-size: 18px; }
      .point-value { fill: #1D4ED8; font-size: 19px; font-weight: 760; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <rect x="0" y="0" width="18" height="900" fill="url(#accent)"/>
  <text x="80" y="72" font-size="20" font-weight="700" letter-spacing="2.4" fill="#2563EB">SPEED IMPROVEMENT · 238 REAL TASKS</text>
  <text x="80" y="135" font-size="46" font-weight="780" class="ink">同一批真实任务：速度差距从 29.5 倍降到 3.29 倍</text>
  <text x="80" y="178" font-size="24" class="muted">相对原版 Atlas 的耗时倍数；1× 表示速度相当，越低越好</text>

  <!-- plot frame -->
  <rect x="90" y="215" width="1090" height="565" rx="18" fill="#FBFDFF" stroke="#CBD5E1"/>
  <text x="116" y="254" font-size="19" font-weight="700" fill="#475569">相对原版 Atlas 的耗时倍数（对数刻度）</text>

  <!-- horizontal grid and y labels: 1,2,4,8,16,32 -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="160" y1="690" x2="1148" y2="690"/>
    <line x1="160" y1="608" x2="1148" y2="608"/>
    <line x1="160" y1="526" x2="1148" y2="526"/>
    <line x1="160" y1="444" x2="1148" y2="444"/>
    <line x1="160" y1="362" x2="1148" y2="362"/>
    <line x1="160" y1="280" x2="1148" y2="280"/>
  </g>
  <g class="axis" text-anchor="end">
    <text x="146" y="696">1×</text>
    <text x="146" y="614">2×</text>
    <text x="146" y="532">4×</text>
    <text x="146" y="450">8×</text>
    <text x="146" y="368">16×</text>
    <text x="146" y="286">32×</text>
  </g>

  <!-- original Atlas reference -->
  <line x1="160" y1="690" x2="1148" y2="690" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="8 8"/>
  <text x="1148" y="680" text-anchor="end" font-size="17" font-weight="700" fill="#B45309">原版 Atlas = 1×</text>

  <!-- area and performance line -->
  <path d="M170 290 L335 386.8 L500 414.6 L665 514.2 L830 523.4 L995 525.8 L1160 549.1 L1160 690 L170 690 Z" fill="url(#area)"/>
  <path d="M170 290 L335 386.8 L500 414.6 L665 514.2 L830 523.4 L995 525.8 L1160 549.1" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- points -->
  <g fill="#FFFFFF" stroke="#2563EB" stroke-width="5">
    <circle cx="170" cy="290" r="9"/>
    <circle cx="335" cy="386.8" r="9"/>
    <circle cx="500" cy="414.6" r="9"/>
    <circle cx="665" cy="514.2" r="9"/>
    <circle cx="830" cy="523.4" r="9"/>
    <circle cx="995" cy="525.8" r="9"/>
    <circle cx="1160" cy="549.1" r="10"/>
  </g>
  <g class="point-value" text-anchor="middle">
    <text x="196" y="282" text-anchor="start">29.5×</text>
    <text x="335" y="362">12.97×</text>
    <text x="500" y="390">10.25×</text>
    <text x="665" y="490">4.42×</text>
    <text x="830" y="499">4.09×</text>
    <text x="995" y="502">4.01×</text>
    <text x="1148" y="530" text-anchor="end">3.29×</text>
  </g>

  <!-- x labels -->
  <g class="axis" text-anchor="middle">
    <text x="170" y="746"><tspan x="170">初始版本</tspan></text>
    <text x="335" y="746" aria-label="减少重复计算"><tspan x="335">减少</tspan><tspan x="335" dy="22">重复计算</tspan></text>
    <text x="500" y="746" aria-label="加快功能查找"><tspan x="500">加快</tspan><tspan x="500" dy="22">功能查找</tspan></text>
    <text x="665" y="746" aria-label="优化核心算法"><tspan x="665">优化</tspan><tspan x="665" dy="22">核心算法</tspan></text>
    <text x="830" y="746" aria-label="优化数据处理"><tspan x="830">优化</tspan><tspan x="830" dy="22">数据处理</tspan></text>
    <text x="995" y="746" aria-label="修复超长文件瓶颈"><tspan x="995">修复超长文件</tspan><tspan x="995" dy="22">瓶颈</tspan></text>
    <text x="1135" y="746" aria-label="当前完整基线"><tspan x="1135">当前</tspan><tspan x="1135" dy="22">完整基线</tspan></text>
  </g>

  <!-- right insights -->
  <g filter="url(#shadow)">
    <rect x="1220" y="215" width="300" height="565" rx="24" fill="#F8FAFC" stroke="#E2E8F0"/>
  </g>
  <text x="1260" y="267" font-size="22" font-weight="720" class="ink">一句话结论</text>
  <text x="1260" y="345" font-size="60" font-weight="800" fill="#2563EB">约 9 倍</text>
  <text x="1260" y="380" font-size="20" class="muted">整体速度差距缩小约 9 倍</text>
  <text x="1260" y="411" font-size="17" class="muted">29.5× → 3.29×</text>

  <line x1="1260" y1="446" x2="1480" y2="446" stroke="#CBD5E1"/>
  <g aria-label="复杂任务：77.2 秒 → 8.4 秒">
    <text x="1260" y="490" font-size="22" font-weight="720" class="ink">复杂任务：</text>
    <text x="1260" y="535" font-size="30" font-weight="780" fill="#059669">77.2 秒 → 8.4 秒</text>
  </g>
  <text x="1260" y="568" font-size="18" class="muted">复杂任务耗时已明显下降</text>

  <line x1="1260" y1="612" x2="1480" y2="612" stroke="#CBD5E1"/>
  <g aria-label="当前主要短板：典型任务内存约为原版的 12.2 倍">
    <text x="1260" y="668" font-size="22" font-weight="720" class="ink">当前主要短板：</text>
    <text x="1260" y="705" font-size="19" font-weight="700" class="muted">典型任务内存约为原版的</text>
    <text x="1260" y="744" font-size="31" font-weight="800" fill="#D97706">12.2 倍</text>
  </g>

  <text x="80" y="852" font-size="19" fill="#64748B">注：“约 9 倍”指相对耗时倍数从 29.5 降至 3.29，不代表所有程序统一加速 9 倍。</text>
</svg>
